name: Patch Windows release for Updater 0.3.18

on:
  push:
    branches: [main]
    paths:
      - '.github/windows-release-0318-patch-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch release workflow
        run: python scripts/patch-windows-release-0318.py
      - name: Commit target workflow and remove temporary helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/sarah-windows-release.yml
          git rm .github/workflows/patch-windows-release-0318.yml .github/windows-release-0318-patch-trigger.txt scripts/patch-windows-release-0318.py
          git diff --cached --check
          git commit -m "Prepare Windows release workflow for Updater 0.3.18"
          git push origin HEAD:main
