name: One-time Actions artifact inventory

on:
  push:
    branches:
      - maintenance/artifact-inventory-20260913
    paths:
      - .github/workflows/one-time-artifact-inventory.yml

permissions:
  actions: read
  contents: read

jobs:
  inventory:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Inventory repository artifacts
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $page = 1
          $artifacts = @()
          do {
            $uri = "https://api.github.com/repos/$env:REPOSITORY/actions/artifacts?per_page=100&page=$page"
            $response = Invoke-RestMethod -Uri $uri -Headers $headers -Method Get
            $batch = @($response.artifacts)
            $artifacts += $batch
            $page++
          } while ($batch.Count -eq 100)

          $totalBytes = [int64](($artifacts | Measure-Object -Property size_in_bytes -Sum).Sum)
          Write-Host "SUMMARY repository=$env:REPOSITORY artifact_count=$($artifacts.Count) total_bytes=$totalBytes"
          foreach ($group in ($artifacts | Group-Object -Property name | Sort-Object Count -Descending)) {
            $bytes = [int64](($group.Group | Measure-Object -Property size_in_bytes -Sum).Sum)
            $expired = @($group.Group | Where-Object { $_.expired }).Count
            Write-Host "GROUP count=$($group.Count) bytes=$bytes expired=$expired name=$($group.Name)"
          }
          foreach ($artifact in ($artifacts | Sort-Object created_at)) {
            Write-Host "ITEM id=$($artifact.id) bytes=$($artifact.size_in_bytes) expired=$($artifact.expired) created=$($artifact.created_at) expires=$($artifact.expires_at) name=$($artifact.name)"
          }
