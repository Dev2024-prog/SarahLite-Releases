name: Sarah production public-runner preflight

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Private SarahDiagnostic branch, tag or commit to verify'
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SARAH_UPDATER_AUTH_URL: ${{ vars.SARAH_UPDATER_AUTH_URL }}
      SARAH_R2_ACCOUNT_ID: ${{ vars.SARAH_R2_ACCOUNT_ID }}
      SARAH_R2_BUCKET: ${{ vars.SARAH_R2_BUCKET }}
      SARAH_R2_PUBLIC_BASE_URL: ${{ vars.SARAH_R2_PUBLIC_BASE_URL }}
      SARAH_RELEASE_PUBLIC_KEY_PEM_B64: ${{ secrets.SARAH_RELEASE_PUBLIC_KEY_PEM_B64 }}
      SARAH_LICENSE_PUBLIC_KEY_PEM_B64: ${{ secrets.SARAH_LICENSE_PUBLIC_KEY_PEM_B64 }}
      SARAH_SUPABASE_URL: ${{ secrets.SARAH_SUPABASE_URL }}
      SARAH_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SARAH_SUPABASE_PUBLISHABLE_KEY }}
      SARAH_R2_ACCESS_KEY_ID: ${{ secrets.SARAH_R2_ACCESS_KEY_ID }}
      SARAH_R2_SECRET_ACCESS_KEY: ${{ secrets.SARAH_R2_SECRET_ACCESS_KEY }}
      SARAH_RELEASE_PRIVATE_KEY_PEM_B64: ${{ secrets.SARAH_RELEASE_PRIVATE_KEY_PEM_B64 }}
      SARAH_BUILD_ADMIN_URL: ${{ secrets.SARAH_BUILD_ADMIN_URL }}
      SARAH_BUILD_ADMIN_TOKEN: ${{ secrets.SARAH_BUILD_ADMIN_TOKEN }}
    steps:
      - name: Validate public release repository configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            SARAH_UPDATER_AUTH_URL SARAH_R2_ACCOUNT_ID SARAH_R2_BUCKET SARAH_R2_PUBLIC_BASE_URL \
            SARAH_RELEASE_PUBLIC_KEY_PEM_B64 SARAH_LICENSE_PUBLIC_KEY_PEM_B64 \
            SARAH_SUPABASE_URL SARAH_SUPABASE_PUBLISHABLE_KEY \
            SARAH_R2_ACCESS_KEY_ID SARAH_R2_SECRET_ACCESS_KEY \
            SARAH_RELEASE_PRIVATE_KEY_PEM_B64 SARAH_BUILD_ADMIN_URL SARAH_BUILD_ADMIN_TOKEN; do
            [[ -n "${!name:-}" ]] || {
              echo "Missing public release repository setting: ${name}" >&2
              exit 1
            }
          done
          [[ "${SARAH_R2_PUBLIC_BASE_URL}" == https://* ]] || {
            echo 'SARAH_R2_PUBLIC_BASE_URL must use HTTPS.' >&2
            exit 1
          }
          [[ "${SARAH_UPDATER_AUTH_URL}" == https://* ]] || {
            echo 'SARAH_UPDATER_AUTH_URL must use HTTPS.' >&2
            exit 1
          }

      - name: Checkout private SarahDiagnostic source
        uses: actions/checkout@v4
        with:
          repository: Dev2024-prog/SarahDiagnostic
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.SARAH_SOURCE_REPO_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source snapshot and required release helpers
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git -C source rev-parse HEAD)"
          [[ "${sha}" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test -s source/scripts/upload-built-artifact-r2.py
          test -s source/scripts/build-full.sh
          test -s source/updater/src/SarahUpdater.Windows/SarahUpdater.Windows.csproj
          echo "Public runner preflight succeeded for SarahDiagnostic ${sha}."
          echo 'No ISO was built and no R2 object was changed.'
