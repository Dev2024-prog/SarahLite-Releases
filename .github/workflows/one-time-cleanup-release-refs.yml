name: One-time cleanup stale release refs

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-cleanup-release-refs.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove stale branches and tags
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          branches=(
            'build/sarah-setup-0.1.3'
            'build/sarah-setup-artifact'
            'build/setup-latest-0313'
            'docs/clarify-readme-security-audience'
            'docs/expand-security-policy'
            'docs/remove-security-referral-wording'
            'fix/migration-copy-before-source-cleanup'
            'maintenance/cleanup-release-repo'
            'patch/updater-0.3.16-source'
            'release/migrate-sarahdiagnostic-releases'
            'release/sarah-updater-0.3.14'
            'release/sarah-updater-0.3.15'
            'release/sarah-updater-0.3.16'
            'release/single-public-releases'
            'release/windows-setup-0.1.3-updater-0.3.15'
            'release/windows-setup-0.1.3-updater-0.3.16'
            'release/windows-tools-0.1.3-0.3.14'
            'validation/license-uninstaller-0311'
            'validation/pending-license-fallback'
            'validation/sarah-setup-bootstrapper'
            'validation/setup-file-lock-012'
            'validation/updater-0.3.9-auto-license'
            'validation/updater-0.3.15-mbr-fix'
            'validation/updater-0.3.16-exclusive-raw-disk'
            'validation/updater-0313-tray-text'
            'validation/updater-self-update'
            'validation/updater-tray-toast'
            'validation/verify-updater-0312-r2'
            'validation/verify-updater-0313-r2'
            'verify/apply-updater-0318-source-fix'
            'verify/updater-0.3.14-r2'
            'verify/updater-0.3.15-r2'
            'verify/updater-0.3.16-r2'
            'verify/updater-0.3.17-r2'
            'verify/updater-0.3.18-build'
            'verify/updater-0.3.18-r2'
            'verify/updater-0.3.19-hosted-trigger'
            'verify/updater-0.3.19-native-write'
            'verify/windows-release-0.1.3-0.3.14'
            'verify/windows-release-0.1.3-0.3.18'
            'verify/windows-setup-0.1.3-updater-0.3.15'
            'verify/windows-setup-0.1.3-updater-0.3.16'
          )

          tags=(
            'sarah-setup-v0.1.4'
            'sarah-setup-v0.1.5'
            'sarah-setup-v0.1.6'
            'sarah-setup-v0.1.7'
            'sarah-setup-v0.1.8'
            'sarah-updater-v0.4.20'
          )

          delete_if_present() {
            local kind="$1"
            local ref="$2"
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/$kind/$ref" >/dev/null 2>&1; then
              echo "Deleting $kind/$ref"
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/$kind/$ref"
            else
              echo "Already absent: $kind/$ref"
            fi
          }

          for branch in "${branches[@]}"; do
            delete_if_present heads "$branch"
          done

          for tag in "${tags[@]}"; do
            delete_if_present tags "$tag"
          done

          echo 'Remaining branches:'
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/" --jq '.[].ref'
          echo 'Remaining tags:'
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/" --jq '.[].ref'

          unexpected_branches="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/" --jq '.[].ref' | grep -v '^refs/heads/main$' || true)"
          if [[ -n "$unexpected_branches" ]]; then
            echo "Unexpected branches remain:" >&2
            echo "$unexpected_branches" >&2
            exit 1
          fi

          unexpected_tags="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/" --jq '.[].ref' | grep -v '^refs/tags/sarah-assistant-v1\.0\.0$' || true)"
          if [[ -n "$unexpected_tags" ]]; then
            echo "Unexpected tags remain:" >&2
            echo "$unexpected_tags" >&2
            exit 1
          fi
