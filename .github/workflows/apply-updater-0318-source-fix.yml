name: Apply Sarah Updater 0.3.18 source fix

on:
  push:
    branches: [main]
    paths:
      - '.github/updater-0318-source-fix-trigger.txt'
  pull_request:
    branches: [main]
    paths:
      - '.github/updater-0318-source-fix-trigger.txt'

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout SarahDiagnostic fix branch
        uses: actions/checkout@v4
        with:
          repository: Dev2024-prog/SarahDiagnostic
          ref: fix/updater-0.3.18-self-update-path
          token: ${{ secrets.SARAH_SOURCE_REPO_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply focused 0.3.18 patch
        run: python scripts/apply-updater-0318-self-update-path-fix.py
      - name: Validate focused source contracts
        run: |
          python tests/UpdaterSelfUpdateSourceTests.py
          python tests/WindowsUsbWriteIsolationSourceTests.py
          git diff --check
      - name: Export corrected source
        uses: actions/upload-artifact@v4
        with:
          name: SarahUpdater-0.3.18-corrected-source
          retention-days: 1
          path: |
            updater/src/SarahUpdater.Windows/MainWindow.SelfUpdate.cs
            updater/src/SarahUpdater.Windows/SarahUpdater.Windows.csproj
            updater/src/SarahUpdater.Windows/WindowsDiskServices.cs
            tests/UpdaterSelfUpdateSourceTests.py
            tests/WindowsUsbWriteIsolationSourceTests.py
