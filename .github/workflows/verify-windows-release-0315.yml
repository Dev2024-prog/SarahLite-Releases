name: Verify Sarah Windows 0.1.3 + 0.3.15 release

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/verify-windows-release-0315.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify published release and assets
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          tag='windows-setup-v0.1.3-updater-v0.3.15'
          expected=(
            'SarahSetup.exe'
            'SarahSetup.sha256'
            'SarahSetup-0.1.3-win-x64.zip'
            'SarahUpdater-0.3.15-win-x64.zip'
            'SarahUpdater-0.3.15-win-x64.sha256'
          )
          for attempt in $(seq 1 24); do
            if gh release view "$tag" --repo "$repo" --json tagName,name,isDraft,isPrerelease,assets > /tmp/release.json 2>/dev/null; then
              python3 - <<'PY'
          import json
          d=json.load(open('/tmp/release.json'))
          expected={
              'SarahSetup.exe',
              'SarahSetup.sha256',
              'SarahSetup-0.1.3-win-x64.zip',
              'SarahUpdater-0.3.15-win-x64.zip',
              'SarahUpdater-0.3.15-win-x64.sha256',
          }
          names={a['name'] for a in d.get('assets', [])}
          if d.get('isDraft') or d.get('isPrerelease'):
              raise SystemExit('release is draft or prerelease')
          missing=expected-names
          if missing:
              raise SystemExit('missing assets: '+', '.join(sorted(missing)))
          print('Verified release:', d['tagName'], d['name'])
          print('Assets:', ', '.join(sorted(names)))
          PY
              exit 0
            fi
            echo "Attempt $attempt: release not visible yet"
            sleep 15
          done
          echo "Release $tag did not appear in time" >&2
          exit 1
