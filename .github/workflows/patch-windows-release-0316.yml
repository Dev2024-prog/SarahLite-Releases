name: Patch Windows release to Updater 0.3.16

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/patch-windows-release-0316.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/windows-setup-0.1.3-updater-0.3.16
          fetch-depth: 0

      - name: Patch workflow and trigger
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/sarah-windows-release.yml')
          text = workflow.read_text(encoding='utf-8')
          old = "if ($env:SARAH_UPDATER_VERSION -ne '0.3.15')"
          new = "if ($env:SARAH_UPDATER_VERSION -ne '0.3.16')"
          if text.count(old) != 1:
              raise SystemExit(f'expected one old version guard, found {text.count(old)}')
          text = text.replace(old, new, 1)
          old = 'This release trigger expects Sarah Updater 0.3.15, source is $env:SARAH_UPDATER_VERSION.'
          new = 'This release trigger expects Sarah Updater 0.3.16, source is $env:SARAH_UPDATER_VERSION.'
          if text.count(old) != 1:
              raise SystemExit(f'expected one old guard message, found {text.count(old)}')
          workflow.write_text(text.replace(old, new, 1), encoding='utf-8')

          Path('.github/windows-release-trigger.txt').write_text(
              'release Sarah Setup 0.1.3 with Sarah Updater 0.3.16\n', encoding='utf-8')
          PY

      - name: Remove temporary patch workflow
        run: rm .github/workflows/patch-windows-release-0316.yml

      - name: Commit patched release configuration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Release Sarah Setup 0.1.3 with Updater 0.3.16"
          git push origin HEAD:release/windows-setup-0.1.3-updater-0.3.16
