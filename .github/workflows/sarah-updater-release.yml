name: Sarah Updater release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Private SarahDiagnostic branch, tag or commit to build'
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: sarah-updater-release
  cancel-in-progress: false

jobs:
  publish-updater:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      SARAH_UPDATER_AUTH_URL: ${{ vars.SARAH_UPDATER_AUTH_URL }}
      SARAH_RELEASE_PUBLIC_KEY_PEM_B64: ${{ secrets.SARAH_RELEASE_PUBLIC_KEY_PEM_B64 }}
      SARAH_RELEASE_PRIVATE_KEY_PEM_B64: ${{ secrets.SARAH_RELEASE_PRIVATE_KEY_PEM_B64 }}
      R2_ACCOUNT_ID: ${{ vars.SARAH_R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.SARAH_R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ vars.SARAH_R2_PUBLIC_BASE_URL }}
      R2_ACCESS_KEY_ID: ${{ secrets.SARAH_R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.SARAH_R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout private SarahDiagnostic source
        uses: actions/checkout@v4
        with:
          repository: Dev2024-prog/SarahDiagnostic
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.SARAH_SOURCE_REPO_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate release configuration
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @(
            'SARAH_UPDATER_AUTH_URL',
            'SARAH_RELEASE_PUBLIC_KEY_PEM_B64',
            'SARAH_RELEASE_PRIVATE_KEY_PEM_B64',
            'R2_ACCOUNT_ID',
            'R2_BUCKET',
            'R2_PUBLIC_BASE_URL',
            'R2_ACCESS_KEY_ID',
            'R2_SECRET_ACCESS_KEY'
          )) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing updater release configuration: $name"
            }
          }
          if (-not $env:SARAH_UPDATER_AUTH_URL.StartsWith('https://')) {
            throw 'SARAH_UPDATER_AUTH_URL must use HTTPS.'
          }
          if (-not $env:R2_PUBLIC_BASE_URL.StartsWith('https://')) {
            throw 'R2_PUBLIC_BASE_URL must use HTTPS.'
          }

      - name: Install publisher dependencies
        shell: pwsh
        working-directory: source
        run: python -m pip install --disable-pip-version-check boto3 requests cryptography

      - name: Generate updater icon
        shell: pwsh
        working-directory: source
        run: ./updater/tools/New-SarahUpdaterIcon.ps1

      - name: Build and test updater
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore updater/SarahUpdater.sln
          if ($LASTEXITCODE -ne 0) { throw 'dotnet restore failed.' }
          dotnet build updater/SarahUpdater.sln --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'dotnet build failed.' }
          dotnet run --project updater/tests/SarahUpdater.Core.Tests/SarahUpdater.Core.Tests.csproj --configuration Release --no-build
          if ($LASTEXITCODE -ne 0) { throw 'Sarah Updater core tests failed.' }
          if (Test-Path 'tests/UpdaterAutomaticLicenseSourceTests.py') {
            python tests/UpdaterAutomaticLicenseSourceTests.py
            if ($LASTEXITCODE -ne 0) { throw 'Automatic-license source contract failed.' }
          }
          if (Test-Path 'tests/UpdaterSelfUpdateSourceTests.py') {
            python tests/UpdaterSelfUpdateSourceTests.py
            if ($LASTEXITCODE -ne 0) { throw 'Self-update source contract failed.' }
          }

      - id: version
        name: Read updater version
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$project = Get-Content 'updater/src/SarahUpdater.Windows/SarahUpdater.Windows.csproj' -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          $version = $version.Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Only stable x.y.z updater versions can be published to updater/latest: $version"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "UPDATER_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Sarah Updater version: $version"

      - name: Package updater with self-update configuration
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          $output = 'updater-release/package'
          Remove-Item 'updater-release' -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $output | Out-Null

          dotnet publish updater/src/SarahUpdater.Windows/SarahUpdater.Windows.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:Version=$env:UPDATER_VERSION `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            --output $output
          if ($LASTEXITCODE -ne 0) { throw 'Sarah Updater publish failed.' }

          Get-ChildItem $output -Filter '*.pdb' -ErrorAction SilentlyContinue | Remove-Item -Force
          [IO.File]::WriteAllBytes(
            (Join-Path $output 'release-public.pem'),
            [Convert]::FromBase64String($env:SARAH_RELEASE_PUBLIC_KEY_PEM_B64))

          $selfUpdateUrl = "$($env:R2_PUBLIC_BASE_URL.TrimEnd('/'))/updater/latest/latest.json"
          @{
            auth_url = $env:SARAH_UPDATER_AUTH_URL.Trim()
            release_public_key_file = 'release-public.pem'
            self_update_manifest_url = $selfUpdateUrl
          } | ConvertTo-Json | Set-Content -Path (Join-Path $output 'updater-config.json') -Encoding UTF8

          foreach ($required in @('SarahUpdater.exe','updater-config.json','release-public.pem')) {
            $path = Join-Path $output $required
            if (-not (Test-Path $path -PathType Leaf) -or (Get-Item $path).Length -le 0) {
              throw "Updater package file missing or empty: $required"
            }
          }

          $zip = "updater-release/SarahUpdater-$env:UPDATER_VERSION-win-x64.zip"
          Compress-Archive -Path "$output/*" -DestinationPath $zip -CompressionLevel Optimal
          if (-not (Test-Path $zip -PathType Leaf) -or (Get-Item $zip).Length -le 0) {
            throw 'Updater ZIP was not created correctly.'
          }
          Write-Host "Updater self-update manifest URL: $selfUpdateUrl"

      - name: Publish signed updater to Cloudflare R2
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/publish-signed-updater-r2.py `
            --zip "updater-release/SarahUpdater-$env:UPDATER_VERSION-win-x64.zip" `
            --version $env:UPDATER_VERSION `
            --output-dir updater-release/signed-metadata
          if ($LASTEXITCODE -ne 0) { throw 'Signed Sarah Updater R2 publish failed.' }

      - name: Release summary
        shell: pwsh
        working-directory: source
        run: |
          $base = $env:R2_PUBLIC_BASE_URL.TrimEnd('/')
          Write-Host "Sarah Updater $env:UPDATER_VERSION published."
          Write-Host "Manifest: $base/updater/latest/latest.json"
          Write-Host "Latest ZIP: $base/updater/latest/SarahUpdater-win-x64.zip"
