name: Sarah Setup build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/sarah-setup-build.yml'
      - '.github/setup-build-trigger.txt'

permissions:
  contents: read

concurrency:
  group: sarah-setup-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-setup:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      SARAH_RELEASE_PUBLIC_KEY_PEM_B64: ${{ secrets.SARAH_RELEASE_PUBLIC_KEY_PEM_B64 }}
    steps:
      - name: Checkout private SarahDiagnostic source
        uses: actions/checkout@v4
        with:
          repository: Dev2024-prog/SarahDiagnostic
          ref: main
          token: ${{ secrets.SARAH_SOURCE_REPO_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Setup build configuration
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:SARAH_RELEASE_PUBLIC_KEY_PEM_B64)) {
            throw 'Missing SARAH_RELEASE_PUBLIC_KEY_PEM_B64.'
          }

      - name: Resolve Sarah Setup version
        id: setup_version
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$project = Get-Content 'updater/src/SarahSetup.Windows/SarahSetup.Windows.csproj'
          $version = @($project.Project.PropertyGroup.Version | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }) | Select-Object -First 1
          $version = ([string]$version).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Sarah Setup project contains an invalid version: $version"
          }
          "SARAH_SETUP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Sarah Setup source version: $version"

      - name: Generate Sarah icon and embed release public key
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          ./updater/tools/New-SarahUpdaterIcon.ps1
          $assetDir = 'updater/src/SarahSetup.Windows/Assets'
          New-Item -ItemType Directory -Force -Path $assetDir | Out-Null
          [IO.File]::WriteAllBytes(
            (Join-Path $assetDir 'release-public.pem'),
            [Convert]::FromBase64String($env:SARAH_RELEASE_PUBLIC_KEY_PEM_B64))
          if ((Get-Item (Join-Path $assetDir 'release-public.pem')).Length -le 0) {
            throw 'Embedded release public key is empty.'
          }

      - name: Run Setup and self-update source contracts
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          python tests/SarahSetupSourceTests.py
          if ($LASTEXITCODE -ne 0) { throw 'Sarah Setup source contract failed.' }
          python tests/UpdaterSelfUpdateSourceTests.py
          if ($LASTEXITCODE -ne 0) { throw 'Sarah Updater self-update source contract failed.' }

      - name: Compile Windows updater solution
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore updater/SarahUpdater.sln
          if ($LASTEXITCODE -ne 0) { throw 'dotnet restore failed.' }
          dotnet build updater/SarahUpdater.sln --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'dotnet build failed.' }

      - name: Publish single-file SarahSetup.exe
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          $output = 'setup-release'
          Remove-Item $output -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          dotnet publish updater/src/SarahSetup.Windows/SarahSetup.Windows.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            --output $output
          if ($LASTEXITCODE -ne 0) { throw 'Sarah Setup publish failed.' }
          Get-ChildItem $output -Filter '*.pdb' -ErrorAction SilentlyContinue | Remove-Item -Force
          $exe = Join-Path $output 'SarahSetup.exe'
          if (-not (Test-Path $exe -PathType Leaf) -or (Get-Item $exe).Length -le 0) {
            throw 'SarahSetup.exe was not produced.'
          }

          $unexpectedExecutables = @(Get-ChildItem $output -File -Filter '*.exe' | Where-Object { $_.Name -ne 'SarahSetup.exe' })
          if ($unexpectedExecutables.Count -gt 0) {
            throw "Unexpected executable(s) in clean Setup output: $($unexpectedExecutables.Name -join ', ')"
          }

          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item $exe).Length
          $hashFile = Join-Path $output 'SarahSetup.sha256'
          Set-Content -Path $hashFile -Value "$hash  SarahSetup.exe" -Encoding ascii
          "SARAH_SETUP_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SARAH_SETUP_SIZE=$size" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "SarahSetup.exe SHA256: $hash"
          Write-Host "SarahSetup.exe size: $size bytes"

      - name: Upload versioned SarahSetup artifact
        uses: actions/upload-artifact@v4
        with:
          name: SarahSetup-${{ steps.setup_version.outputs.version }}-win-x64
          path: |
            source/setup-release/SarahSetup.exe
            source/setup-release/SarahSetup.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Build summary
        shell: pwsh
        run: |
          Write-Host "SarahSetup $env:SARAH_SETUP_VERSION created successfully."
          Write-Host "Size: $env:SARAH_SETUP_SIZE bytes"
          Write-Host "SHA256: $env:SARAH_SETUP_SHA256"
