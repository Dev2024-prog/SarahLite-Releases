name: Migrate SarahDiagnostic Releases

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/migrate-sarahdiagnostic-releases.yml'

permissions:
  contents: write

concurrency:
  group: migrate-sarahdiagnostic-releases
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SOURCE_REPOSITORY: Dev2024-prog/SarahDiagnostic
      DEST_REPOSITORY: Dev2024-prog/SarahLite-Releases
      SOURCE_TOKEN: ${{ secrets.SARAH_SOURCE_REPO_TOKEN }}
      DEST_TOKEN: ${{ github.token }}
    steps:
      - name: Validate tokens
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SOURCE_TOKEN:-}" || { echo 'Missing SARAH_SOURCE_REPO_TOKEN.' >&2; exit 1; }
          test -n "${DEST_TOKEN:-}" || { echo 'Missing destination GITHUB_TOKEN.' >&2; exit 1; }
          GH_TOKEN="$SOURCE_TOKEN" gh api "repos/$SOURCE_REPOSITORY" --jq '.full_name' >/dev/null
          GH_TOKEN="$DEST_TOKEN" gh api "repos/$DEST_REPOSITORY" --jq '.full_name' >/dev/null

      - name: Copy, verify, then remove source Releases
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/sarah-release-migration"
          rm -rf "$root"
          mkdir -p "$root"

          GH_TOKEN="$SOURCE_TOKEN" gh api --paginate "repos/$SOURCE_REPOSITORY/releases?per_page=100" --jq '.[] | @base64' > "$root/releases.b64"
          release_count="$(wc -l < "$root/releases.b64" | tr -d ' ')"
          echo "Source releases to migrate: $release_count"

          while IFS= read -r encoded; do
            test -n "$encoded" || continue
            release_json="$(printf '%s' "$encoded" | base64 --decode)"
            id="$(jq -r '.id' <<<"$release_json")"
            tag="$(jq -r '.tag_name' <<<"$release_json")"
            title="$(jq -r '.name // .tag_name' <<<"$release_json")"
            body="$(jq -r '.body // ""' <<<"$release_json")"
            draft="$(jq -r '.draft' <<<"$release_json")"
            prerelease="$(jq -r '.prerelease' <<<"$release_json")"
            asset_count="$(jq '.assets | length' <<<"$release_json")"

            test -n "$tag" && test "$tag" != "null" || { echo "Release $id has no tag." >&2; exit 1; }
            echo "---- Migrating $tag ($asset_count assets) ----"

            work="$root/$id"
            rm -rf "$work"
            mkdir -p "$work"

            if (( asset_count > 0 )); then
              while IFS=$'\t' read -r asset_name asset_url asset_size asset_digest; do
                echo "Downloading $asset_name"
                GH_TOKEN="$SOURCE_TOKEN" gh api -H 'Accept: application/octet-stream' "$asset_url" > "$work/$asset_name"
                local_size="$(stat -c '%s' "$work/$asset_name")"
                if [[ "$local_size" != "$asset_size" ]]; then
                  echo "Source download size mismatch for $asset_name: $local_size != $asset_size" >&2
                  exit 1
                fi
                if [[ -n "$asset_digest" && "$asset_digest" != "null" && "$asset_digest" == sha256:* ]]; then
                  expected="${asset_digest#sha256:}"
                  actual="$(sha256sum "$work/$asset_name" | awk '{print $1}')"
                  [[ "$actual" == "$expected" ]] || {
                    echo "Source download SHA-256 mismatch for $asset_name" >&2
                    exit 1
                  }
                fi
              done < <(jq -r '.assets[] | [.name,.url,(.size|tostring),(.digest // "")] | @tsv' <<<"$release_json")
            fi

            migration_note=$'\n\nBuild/source repository: Dev2024-prog/SarahDiagnostic\nMigrated to the single public download repository: Dev2024-prog/SarahLite-Releases'
            if [[ "$body" != *"Migrated to the single public download repository"* ]]; then
              body="${body}${migration_note}"
            fi

            dest_json=''
            if dest_json="$(GH_TOKEN="$DEST_TOKEN" gh api "repos/$DEST_REPOSITORY/releases/tags/$tag" 2>/dev/null)"; then
              dest_id="$(jq -r '.id' <<<"$dest_json")"
              jq -n \
                --arg name "$title" \
                --arg body "$body" \
                --argjson draft "$draft" \
                --argjson prerelease "$prerelease" \
                '{name:$name,body:$body,draft:$draft,prerelease:$prerelease}' > "$work/release.json"
              GH_TOKEN="$DEST_TOKEN" gh api --method PATCH "repos/$DEST_REPOSITORY/releases/$dest_id" --input "$work/release.json" >/dev/null
            else
              jq -n \
                --arg tag "$tag" \
                --arg name "$title" \
                --arg body "$body" \
                --argjson draft "$draft" \
                --argjson prerelease "$prerelease" \
                '{tag_name:$tag,target_commitish:"main",name:$name,body:$body,draft:$draft,prerelease:$prerelease}' > "$work/release.json"
              GH_TOKEN="$DEST_TOKEN" gh api --method POST "repos/$DEST_REPOSITORY/releases" --input "$work/release.json" >/dev/null
            fi

            if (( asset_count > 0 )); then
              mapfile -d '' files < <(find "$work" -maxdepth 1 -type f ! -name 'release.json' -print0)
              GH_TOKEN="$DEST_TOKEN" gh release upload "$tag" "${files[@]}" --repo "$DEST_REPOSITORY" --clobber
            fi

            verified_json="$(GH_TOKEN="$DEST_TOKEN" gh api "repos/$DEST_REPOSITORY/releases/tags/$tag")"
            while IFS=$'\t' read -r asset_name asset_size asset_digest; do
              dest_size="$(jq -r --arg n "$asset_name" '.assets[] | select(.name==$n) | .size' <<<"$verified_json" | head -n1)"
              dest_digest="$(jq -r --arg n "$asset_name" '.assets[] | select(.name==$n) | (.digest // "")' <<<"$verified_json" | head -n1)"
              [[ -n "$dest_size" && "$dest_size" == "$asset_size" ]] || {
                echo "Destination asset verification failed for $asset_name" >&2
                exit 1
              }
              if [[ -n "$asset_digest" && "$asset_digest" != "null" && -n "$dest_digest" && "$dest_digest" != "null" ]]; then
                [[ "$dest_digest" == "$asset_digest" ]] || {
                  echo "Destination digest mismatch for $asset_name" >&2
                  exit 1
                }
              fi
            done < <(jq -r '.assets[] | [.name,(.size|tostring),(.digest // "")] | @tsv' <<<"$release_json")

            echo "Verified $tag in $DEST_REPOSITORY. Removing source Release only after verification."
            GH_TOKEN="$SOURCE_TOKEN" gh api --method DELETE "repos/$SOURCE_REPOSITORY/releases/$id" >/dev/null
            GH_TOKEN="$SOURCE_TOKEN" gh api --method DELETE "repos/$SOURCE_REPOSITORY/git/refs/tags/$tag" >/dev/null 2>&1 || true
            rm -rf "$work"
          done < "$root/releases.b64"

      - name: Verify single release location
        shell: bash
        run: |
          set -euo pipefail
          remaining="$(GH_TOKEN="$SOURCE_TOKEN" gh api "repos/$SOURCE_REPOSITORY/releases?per_page=100" --jq 'length')"
          [[ "$remaining" == "0" ]] || {
            echo "$remaining source release(s) remain in SarahDiagnostic." >&2
            exit 1
          }
          echo "All GitHub Releases are now centralized in $DEST_REPOSITORY."
